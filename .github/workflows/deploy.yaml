name: Test AWS OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("ISSUER:", payload.iss);
            console.log("AUDIENCE:", payload.aud);
            console.log("SUBJECT:", payload.sub);
            console.log("REPOSITORY:", payload.repository);
            console.log("REPOSITORY_ID:", payload.repository_id);
            console.log("OWNER:", payload.repository_owner);
            console.log("OWNER_ID:", payload.repository_owner_id);
            console.log("REF:", payload.ref);
            console.log("EVENT:", payload.event_name);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::349311508967:role/VocabularyGitHubActionsRole
          aws-region: ap-south-1
          role-session-name: GitHubActionsOIDCTest

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity