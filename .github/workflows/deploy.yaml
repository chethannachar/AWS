name: Deploy Backend to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub repository and branch
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Ref: $GITHUB_REF"

      - name: Inspect GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        shell: bash
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | base64 -d 2>/dev/null)

          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            ref,
            repository,
            repository_id,
            repository_owner_id
          }'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Find ASG instances
        id: instances
        shell: bash
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names vocabulary-backend-asg \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No InService instances found in the ASG."
            exit 1
          fi

          echo "Found ASG instances: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy to ASG instances
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.instances.outputs.instance_ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest Vocabulary backend" \
            --parameters 'commands=[
              "cd /home/ubuntu/AWS",
              "git fetch origin",
              "git reset --hard origin/main",
              "/home/ubuntu/AWS/backend/.venv/bin/pip install -r /home/ubuntu/AWS/backend/requirements.txt",
              "sudo systemctl restart fastapi",
              "sudo systemctl is-active --quiet fastapi"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for INSTANCE_ID in ${{ steps.instances.outputs.instance_ids }}; do
            echo "Waiting for deployment on $INSTANCE_ID..."

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            echo "Deployment successful on $INSTANCE_ID"
          done